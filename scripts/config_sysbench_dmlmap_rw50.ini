[database]
db = mysql
host = 127.0.0.1
port = 3306
user = root
sock = ../mysql_build/mysql.sock
cnf = ../mysql_build/cnf/my.cnf
mysqld = ../mysql_build/bin/mysqld
knob_config_file = ./experiment/gen_knobs/DML_12.json
knob_num = 12
dbname = sbtest
workload = sysbench
thread_num = 4
sysbench_tables = 64
sysbench_table_size = 1000000
workload_type = readwrite
workload_warmup_time = 30
workload_time = 15
remote_mode = False
online_mode = False

[tune]
task_id = dmlmap_sysbench_rw50
exclude_contexts = 64-1000000-4-oltp_read_write_50-0.2
performance_metric = ['tps']
reference_point = [None, None]
constraints = []
max_runs = 2
selector_type = shap
initial_runs = 1
initial_tunable_knob_num = 12
incremental = none
incremental_every = 10
incremental_num = 2
optimize_method = MBO
space_transfer = None
auto_optimizer = None
auto_optimizer_type = learned
only_range = None
only_knob = None
batch_size = 16
mean_var_file = mean_var_file.pkl
replay_memory =
params =
transfer_framework = workload_map
data_repo = ./DBTune_history/csv_source
internal_metrics_source = prometheus
mapping_method = dml
mapping_prune_metrics = false
dml_model_path = ../autotune/optimizer/dml_models_loo_rw50/context_model.pth
dml_context_metrics_path = ../autotune/optimizer/dml_models_loo_rw50/context_default_metrics_all.csv
prometheus_url = http://localhost:9090
mysql_instance = mysqld-exporter:9104
node_instance = node-exporter:9100
