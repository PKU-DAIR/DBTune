# Base ini for prepare tasks. The Miyabi backend copies this and fills in the workload
# keys ([database], from the benchmark adapter), the paths, and the [tune] section.
[database]
db = mysql
host = 127.0.0.1
port = 3306
user = root
sock = /tmp/dbtune.sock
cnf = FILLED
mysqld = FILLED
knob_config_file = FILLED
knob_num = -1
dbname = sbtest
workload = sysbench
thread_num = 128
sysbench_tables = 150
sysbench_table_size = 800000
workload_type = readwrite
workload_warmup_time = 60
workload_time = 120
remote_mode = False
online_mode = True
graceful_shutdown = True

[tune]
task_id = FILLED
performance_metric = ['tps']
reference_point = [None, None]
constraints = []
max_runs = FILLED
selector_type = shap
initial_runs = 10
initial_tunable_knob_num = -1
incremental = none
incremental_every = 10
incremental_num = 2
optimize_method = FILLED
space_transfer = None
auto_optimizer = None
auto_optimizer_type = learned
only_range = None
only_knob = None
batch_size = 16
mean_var_file = mean_var_file.pkl
replay_memory =
params =
transfer_framework = none
data_repo = ./DBTune_history/empty_repo
rand_seed = 42
internal_metrics_source = prometheus
prometheus_url = http://localhost:9090
mysql_instance = mysqld-exporter:9104
node_instance = node-exporter:9100
