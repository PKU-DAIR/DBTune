[database]
db = postgresql
deployment_mode = kubernetes

host = localhost
port = 5432
user = app
passwd = CHANGE_ME
dbname = app
sock = /var/run/postgresql/.s.PGSQL.5432
cnf = /etc/postgresql/14/main/postgresql.conf
pg_ctl = /usr/lib/postgresql/14/bin/pg_ctl
pgdata = /var/lib/postgresql/14/main
postgres = /usr/lib/postgresql/14/bin/postgres

k8s_prometheus_namespace = monitoring
k8s_prometheus_service = prometheus-kube-prometheus-prometheus
k8s_prometheus_port = 9090

k8s_pg_namespace = pg
k8s_pg_cluster_name = pg-cluster
k8s_pg_primary_node_instance =

k8s_pg_database = tpcc
k8s_benchmark_namespace = benchmark

benchmark_type = tpcc
benchmark_tpcc_vus = 20
benchmark_tpcc_rampup_min = 2
benchmark_tpcc_duration_min = 5
benchmark_tpch_vus = 1
benchmark_tpch_querysets = 1
benchmark_tpch_dop = 2
benchmark_tpch_scale = 1

workload = tpcc

knob_num = 5
knob_config_file = scripts/experiment/gen_knobs/postgres_fog_2gb.json
thread_num = 4
workload_warmup_time = 120
workload_time = 300
remote_mode = False
online_mode = False
isolation_mode = False
ssh_user =
pid = 0
cpu_core =
lhs_log =

[tune]
task_id = dbtune_specialist_2gb_v11
performance_metric = ['tps']
reference_point = [None]
constraints =
max_runs = 200
steps_per_phase = 200
optimize_method = EdgeDDPG
selector_type = shap
incremental = none
transfer_framework = none
initial_runs = 5
init_strategy = latin_hypercube
initial_tunable_knob_num = -1
incremental_every = 5
incremental_num = 1
space_transfer = False
auto_optimizer = False
auto_optimizer_type = learned
only_knob = False
only_range = False
batch_size = 8

use_fog_reward = True

mean_var_file = specialist_2gb_v11_mean_var.pkl
replay_memory =
params =
data_repo =
