[database]
# db: [mysql, postgres]
db = mysql
# Host IP Address
host = 127.0.0.1
# Host Port Number
port = 3306
# Database User Name
user = root
# Database Password
; passwd = 1234567
# socket
sock =  ../mysql_build/mysql.sock
# db cnf file on clientDB host
cnf = ../mysql_build/cnf/my.cnf


####### MySQL related config
# path to mysqld on clientDB host
mysqld = ../mysql_build/bin/mysqld

####### PostgreSQL related config
# path to pg_ctl on clientDB host
pg_ctl = /home/changzhuo.cz/postgresql/bin/pg_ctl
# path to PGDATA on clientDB host
pgdata = /home/changzhuo.cz/data
# path to postgres on clientDB host
postgres = /home/changzhuo.cz/postgresql/bin/postgres

####### DB knob related
# knob config file
knob_config_file =  ./experiment/gen_knobs/OLTP_8.0.json
# number of tuning knobs (counting from the first)
knob_num = 20

####### Workload related
# Database Name
dbname = ycsb
# workload name [sysbench, tpcc, workload_zoo,  oltpbench_twitter, oltpbench_ycsb]
workload = oltpbench_ycsb
# oltpbenchmark config
oltpbench_config_xml = /work/dpl-sfc/users/tatsu/tmp/DBTune/third_party/oltpbench/config/sample_ycsb_config.xml
# thread_num
thread_num = 32
# [`read`, `write`, `readwrite`]
workload_type = write
# workload warmup time
workload_warmup_time = 0
# workload run time
workload_time = 15

####### Remote tuning related
# whether tune remotely
remote_mode = False
# username on remote host
; ssh_user = ruike.xy

####### Online tuning related
# whether not restart db
online_mode = False

####### Resource isolation related
# whether isolate resource usage
; isolation_mode = True
# pid for resource isolation in online tuning
; pid = 4110


[tune]
# task id
task_id = performance1
# performance_metric: [tps, lat, qps, cpu, IO, readIO, writeIO, virtualMem, physical]
# default maximization, '- 'minus means minimization
performance_metric = ['tps']
# set for multi-objective tuning
reference_point = [None, None]
#constraints: Non-positive constraint values (”<=0”) imply feasibility.
constraints = []
# maximum tuning iteration
max_runs = 200

############Knob Selection###############
# selector_type [shap, fanova, gini, ablation, lasso]
selector_type = shap
# initial_runs
initial_runs = 10
#tunalbe_knob_num
initial_tunable_knob_num = 20
#incremental: [none, increase, decrease]
incremental = none
incremental_every = 10
incremental_num = 2

############Optimizer###############
# tuning method [MBO, SMAC, TPE, DDPG, TurBO, GA]
optimize_method = SMAC

space_transfer = None
auto_optimizer = None
only_range = None
only_knob = None

###TurBO####
# whether TurBO start from the scratch
tr_init = True

###DDPG####
batch_size = 16
mean_var_file = mean_var_file.pkl
# dir for memory pool
replay_memory =
# dir for params
params = model_params/11111_135


############Transfer###############
# transfer_framework :[none, workload_map, rgpe, finetune, dml]
transfer_framework = none
# dir of source data for mapping
data_repo = ./logs/bo_history

###Internal Metrics Source###
# internal_metrics_source: [innodb, prometheus]
# innodb: collect 65 INNODB_METRICS via SQL (default DBTune behavior)
# prometheus: collect 114 metrics via Prometheus (matches CSV training data format)
internal_metrics_source = prometheus

###DML (Deep Metric Learning) Transfer###
# path to trained model weights
dml_model_path = ../autotune/optimizer/dml_models/context_model.pth
# path to context default metrics CSV
dml_context_metrics_path = ../autotune/optimizer/dml_models/context_default_metrics_all.csv
# directory containing *-result.csv files with historical configs
dml_result_data_dir = ../DBMSTransferLearning/dataset
# optional: Prometheus URL for metric collection (leave empty to use DBTune's collectors)
prometheus_url =
# optional: Prometheus instance labels for filtering
mysql_instance = mysqld-exporter:9104
node_instance = node-exporter:9100


