data_repo = ./logs/bo_history
dml_model_path = ../autotune/optimizer/dml_models_sysbench/context_model.pth
dml_context_metrics_path = ../autotune/optimizer/dml_models_sysbench/context_default_metrics_no_write_only.csv
dml_result_data_dir = ../DBMSTransferLearning/dataset
prometheus_url = http://localhost:9090
mysql_instance = mysqld-exporter:9104
node_instance = node-exporter:9100
