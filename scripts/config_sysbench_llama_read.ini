[database]
db = mysql
host = 127.0.0.1
port = 3306
user = root
sock = ../mysql_build/mysql.sock
cnf = ../mysql_build/cnf/my.cnf
mysqld = ../mysql_build/bin/mysqld
knob_config_file = ./experiment/gen_knobs/mysql_all_8044_validated.json
knob_num = -1
dbname = sbtest
workload = sysbench
thread_num = 4
sysbench_tables = 64
sysbench_table_size = 1000000
workload_type = read
workload_warmup_time = 30
workload_time = 90
remote_mode = False
online_mode = False

[tune]
task_id = llama_sysbench_read
performance_metric = ['tps']
reference_point = [None, None]
constraints = []
max_runs = 10
selector_type = shap
initial_runs = 1
initial_tunable_knob_num = -1
incremental = none
incremental_every = 10
incremental_num = 2
optimize_method = LlamaTune
llamatune_low_dim = 16
llamatune_max_num_values = 10000
llamatune_surrogate = prf
space_transfer = None
auto_optimizer = None
auto_optimizer_type = learned
only_range = None
only_knob = None
batch_size = 16
mean_var_file = mean_var_file.pkl
replay_memory =
params =
transfer_framework = none
data_repo = ./DBTune_history/csv_source
internal_metrics_source = prometheus
prometheus_url = http://localhost:9090
mysql_instance = mysqld-exporter:9104
node_instance = node-exporter:9100
